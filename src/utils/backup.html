<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Tester</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin
        src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prettier/2.8.8/standalone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prettier/2.8.8/parser-babel.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            overflow: hidden;
        }

        /* VS Code-like scrollbars */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #2d2d30;
        }

        ::-webkit-scrollbar-thumb {
            background: #464647;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a5a;
        }

        /* VS Code Syntax Highlighting */
        .token-string {
            color: #ce9178;
        }

        .token-number {
            color: #b5cea8;
        }

        .token-boolean {
            color: #569cd6;
        }

        .token-null {
            color: #569cd6;
        }

        .token-key {
            color: #9cdcfe;
            font-weight: 400;
        }

        .token-punctuation {
            color: #d4d4d4;
        }

        .token-operator {
            color: #d4d4d4;
        }

        .token-comment {
            color: #6a9955;
            font-style: italic;
        }

        /* XML Tokens */
        .token-tag {
            color: #569cd6;
        }

        .token-attr-name {
            color: #92c5f8;
        }

        .token-attr-value {
            color: #ce9178;
        }

        .token-text {
            color: #d4d4d4;
        }

        /* Line highlight */
        .line-highlight {
            background-color: #2a2d2e;
            display: block;
            margin: 0 -1rem;
            padding: 0 1rem;
        }

        /* Custom input styles to match VS Code */
        .vscode-input {
            background: #3c3c3c;
            border: 1px solid #464647;
            color: #cccccc;
            font-family: 'JetBrains Mono', monospace;
        }

        .vscode-input:focus {
            border-color: #007acc;
            box-shadow: 0 0 0 1px #007acc;
            outline: none;
        }

        .vscode-button {
            background: #0e639c;
            border: 1px solid #0e639c;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }

        .vscode-button:hover {
            background: #1177bb;
            border-color: #1177bb;
        }

        .vscode-button:disabled {
            background: #464647;
            border-color: #464647;
            color: #8c8c8c;
        }

        /* Tab styling */
        .tab-active {
            background: #1e1e1e;
            border-bottom: 2px solid #007acc;
            color: #ffffff;
        }

        .tab-inactive {
            background: #2d2d30;
            color: #cccccc;
            border-bottom: 2px solid transparent;
        }

        .tab-inactive:hover {
            background: #383838;
        }

        /* Status bar styling */
        .status-success {
            background: #16a085;
            color: white;
        }

        .status-error {
            background: #e74c3c;
            color: white;
        }

        .status-warning {
            background: #f39c12;
            color: white;
        }

        /* Method badges VS Code style */
        .method-get {
            background: #61affe;
            color: white;
        }

        .method-post {
            background: #49cc90;
            color: white;
        }

        .method-put {
            background: #fca130;
            color: white;
        }

        .method-patch {
            background: #50e3c2;
            color: black;
        }

        .method-delete {
            background: #f93e3e;
            color: white;
        }

        .method-head {
            background: #9012fe;
            color: white;
        }

        .method-options {
            background: #0d5aa7;
            color: white;
        }

        /* Editor line numbers */
        .line-numbers {
            color: #858585;
            user-select: none;
            font-variant-numeric: tabular-nums;
        }

        /* Validation indicators */
        .validation-error {
            border-left: 3px solid #f14c4c;
            background: rgba(241, 76, 76, 0.1);
        }

        .validation-success {
            border-left: 3px solid #89d185;
            background: rgba(137, 209, 133, 0.1);
        }

        /* Auto-save indicator */
        .auto-save-indicator {
            color: #22863a;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .auto-save-indicator.saving {
            color: #f39c12;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .pulse {
            animation: pulse 1s infinite;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Storage utility functions (using variables instead of sessionStorage)
        let requestsStorage = [];
        let settingsStorage = { activeWorkspace: 'requests' };

        const saveRequestsToStorage = (requests) => {
            requestsStorage = [...requests];
        };

        const loadRequestsFromStorage = () => {
            return [...requestsStorage];
        };

        const saveSettingsToStorage = (settings) => {
            settingsStorage = { ...settings };
        };

        const loadSettingsFromStorage = () => {
            return { ...settingsStorage };
        };

        // Enhanced formatting utilities using Prettier and js-beautify
        const formatJSON = (jsonString) => {
            try {
                const parsed = JSON.parse(jsonString);
                return JSON.stringify(parsed, null, 2);
            } catch (e) {
                return jsonString;
            }
        };

        const formatJSONWithPrettier = (jsonString) => {
            try {
                return prettier.format(jsonString, {
                    parser: 'json',
                    plugins: prettierPlugins,
                    tabWidth: 2,
                    useTabs: false,
                    semi: false,
                    singleQuote: false,
                    trailingComma: 'none'
                });
            } catch (e) {
                // Fallback to basic formatting
                return formatJSON(jsonString);
            }
        };

        const formatXML = (xmlString) => {
            try {
                return html_beautify(xmlString, {
                    indent_size: 2,
                    wrap_line_length: 0,
                    wrap_attributes_indent_size: 2,
                    preserve_newlines: false,
                    max_preserve_newlines: 1,
                    indent_inner_html: true,
                    indent_char: ' ',
                    unformatted: []
                });
            } catch (e) {
                return xmlString;
            }
        };

        const validateJSON = (jsonString) => {
            try {
                JSON.parse(jsonString);
                return { valid: true, error: null };
            } catch (e) {
                return { valid: false, error: e.message };
            }
        };

        // Enhanced syntax highlighting for VS Code theme
        const highlightJSON = (jsonString) => {
            if (!jsonString) return '';

            try {
                return jsonString
                    .replace(/("(?:\\.|[^"\\])*")(\s*:\s*)/g, '<span class="token-key">$1</span><span class="token-punctuation">$2</span>')
                    .replace(/:\s*("(?:\\.|[^"\\])*")/g, ': <span class="token-string">$1</span>')
                    .replace(/:\s*(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g, ': <span class="token-number">$1</span>')
                    .replace(/:\s*(true|false)/g, ': <span class="token-boolean">$1</span>')
                    .replace(/:\s*(null)/g, ': <span class="token-null">$1</span>')
                    .replace(/([{}[\],])/g, '<span class="token-punctuation">$1</span>')
                    .replace(/^(\s*)(.*?)$/gm, '<span class="line">$1$2</span>');
            } catch (e) {
                return jsonString;
            }
        };

        const highlightXML = (xmlString) => {
            if (!xmlString) return '';

            try {
                return xmlString
                    .replace(/(&lt;\/?)(\w+)([^&gt;]*?)(&gt;)/g, '<span class="token-tag">$1$2</span><span class="token-attr-name">$3</span><span class="token-tag">$4</span>')
                    .replace(/(\w+)=(["'][^"']*["'])/g, '<span class="token-attr-name">$1</span>=<span class="token-attr-value">$2</span>')
                    .replace(/^(\s*)(.*?)$/gm, '<span class="line">$1$2</span>');
            } catch (e) {
                return xmlString;
            }
        };

        const generateLineNumbers = (text) => {
            const lines = (text || '\n').split('\n').length;
            return Array.from({ length: lines }, (_, i) => i + 1).join('\n');
        };

        // VS Code-style Code Editor Component with auto-save
        function VSCodeEditor({ value, onChange, language = 'json', className = '', onAutoSave }) {
            const textareaRef = useRef(null);
            const highlightRef = useRef(null);
            const lineNumbersRef = useRef(null);
            const autoSaveTimeoutRef = useRef(null);
            const [validation, setValidation] = useState({ valid: true, error: null });
            const [autoSaveStatus, setAutoSaveStatus] = useState('saved'); // 'saved', 'saving', 'pending'

            useEffect(() => {
                if (language === 'json') {
                    const result = validateJSON(value);
                    setValidation(result);
                }
            }, [value, language]);

            // Auto-save functionality
            useEffect(() => {
                if (language === 'json' && onAutoSave) {
                    setAutoSaveStatus('pending');

                    // Clear existing timeout
                    if (autoSaveTimeoutRef.current) {
                        clearTimeout(autoSaveTimeoutRef.current);
                    }

                    // Set new timeout for auto-save
                    autoSaveTimeoutRef.current = setTimeout(() => {
                        setAutoSaveStatus('saving');
                        onAutoSave(value);
                        setTimeout(() => setAutoSaveStatus('saved'), 500);
                    }, 1000); // Auto-save after 1 second of inactivity
                }

                return () => {
                    if (autoSaveTimeoutRef.current) {
                        clearTimeout(autoSaveTimeoutRef.current);
                    }
                };
            }, [value, language, onAutoSave]);

            const handleScroll = (e) => {
                const scrollTop = e.target.scrollTop;
                const scrollLeft = e.target.scrollLeft;

                if (highlightRef.current) {
                    highlightRef.current.scrollTop = scrollTop;
                    highlightRef.current.scrollLeft = scrollLeft;
                }
                if (lineNumbersRef.current) {
                    lineNumbersRef.current.scrollTop = scrollTop;
                }
            };

            const formatCode = () => {
                if (language === 'json') {
                    const formatted = formatJSONWithPrettier(value);
                    onChange(formatted);
                } else if (language === 'xml') {
                    const formatted = formatXML(value);
                    onChange(formatted);
                }
            };

            const minifyCode = () => {
                if (language === 'json') {
                    try {
                        const minified = JSON.stringify(JSON.parse(value));
                        onChange(minified);
                    } catch (e) {
                        // Invalid JSON, do nothing
                    }
                }
            };

            const getHighlightedCode = () => {
                if (language === 'json') {
                    return highlightJSON(value);
                } else if (language === 'xml') {
                    return highlightXML(value);
                }
                return value;
            };

            return (
                <div className={`flex flex-col h-full bg-gray-900 border border-gray-600 rounded ${className}`}>
                    {/* Toolbar */}
                    <div className="flex items-center justify-between px-3 py-2 bg-gray-800 border-b border-gray-600">
                        <div className="flex items-center space-x-2">
                            <button
                                onClick={formatCode}
                                className="px-2 py-1 text-xs bg-gray-700 hover:bg-gray-600 text-white rounded"
                                title="Format Code"
                            >
                                <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z" />
                                </svg>
                            </button>
                            {language === 'json' && (
                                <button
                                    onClick={minifyCode}
                                    className="px-2 py-1 text-xs bg-gray-700 hover:bg-gray-600 text-white rounded"
                                    title="Minify JSON"
                                >
                                    <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                                        <path fillRule="evenodd" d="M3 4a1 1 0 011-1h4a1 1 0 010 2H6.414l2.293 2.293a1 1 0 11-1.414 1.414L5 6.414V8a1 1 0 01-2 0V4zm9 1a1 1 0 010-2h4a1 1 0 011 1v4a1 1 0 01-2 0V6.414l-2.293 2.293a1 1 0 11-1.414-1.414L13.586 5H12zm-9 7a1 1 0 012 0v1.586l2.293-2.293a1 1 0 111.414 1.414L6.414 15H8a1 1 0 010 2H4a1 1 0 01-1-1v-4zm13-1a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 010-2h1.586l-2.293-2.293a1 1 0 111.414-1.414L15 13.586V12a1 1 0 011-1z" clipRule="evenodd" />
                                    </svg>
                                </button>
                            )}
                            {language === 'json' && onAutoSave && (
                                <div className={`auto-save-indicator ${autoSaveStatus === 'saving' ? 'saving' : ''}`}>
                                    {autoSaveStatus === 'saving' && (
                                        <svg className="w-3 h-3 animate-spin" fill="currentColor" viewBox="0 0 20 20">
                                            <path d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H8a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H12a1 1 0 110-2h4a1 1 0 011 1v4a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" />
                                        </svg>
                                    )}
                                    {autoSaveStatus === 'saved' && (
                                        <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                                            <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                                        </svg>
                                    )}
                                    {autoSaveStatus === 'pending' && (
                                        <div className="w-3 h-3 bg-yellow-500 rounded-full pulse"></div>
                                    )}
                                    <span>
                                        {autoSaveStatus === 'saving' ? 'Saving...' :
                                            autoSaveStatus === 'saved' ? 'Saved' : 'Pending...'}
                                    </span>
                                </div>
                            )}
                        </div>
                        {language === 'json' && (
                            <div className={`flex items-center text-xs px-2 py-1 rounded ${validation.valid ? 'validation-success' : 'validation-error'}`}>
                                {validation.valid ? (
                                    <>
                                        <svg className="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                            <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                                        </svg>
                                        Valid JSON
                                    </>
                                ) : (
                                    <>
                                        <svg className="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                            <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd" />
                                        </svg>
                                        {validation.error}
                                    </>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Editor */}
                    <div className="flex-1 relative bg-gray-900 font-mono text-sm overflow-hidden">
                        {/* Line numbers */}
                        <div
                            ref={lineNumbersRef}
                            className="absolute left-0 top-0 bottom-0 w-12 bg-gray-800 border-r border-gray-600 p-3 line-numbers text-right overflow-hidden"
                        >
                            <pre className="whitespace-pre leading-6">{generateLineNumbers(value || '\n')}</pre>
                        </div>

                        {/* Syntax highlighting overlay */}
                        <div
                            ref={highlightRef}
                            className="absolute left-12 top-0 right-0 bottom-0 p-3 pointer-events-none overflow-auto leading-6"
                            style={{ color: 'transparent' }}
                        >
                            <pre
                                className="whitespace-pre-wrap break-words"
                                dangerouslySetInnerHTML={{ __html: getHighlightedCode() }}
                            />
                        </div>

                        {/* Text input */}
                        <textarea
                            ref={textareaRef}
                            className="absolute left-12 top-0 right-0 bottom-0 p-3 bg-transparent text-white resize-none outline-none leading-6 font-mono"
                            style={{ caretColor: 'white' }}
                            value={value}
                            onChange={(e) => onChange(e.target.value)}
                            onScroll={handleScroll}
                            placeholder={`Enter ${language.toUpperCase()} content here...`}
                            spellCheck={false}
                        />
                    </div>
                </div>
            );
        }

        // Enhanced Response Viewer Component
        function VSCodeResponseViewer({ response, activeTab }) {
            const [formattedBody, setFormattedBody] = useState('');
            const [contentType, setContentType] = useState('text');

            useEffect(() => {
                if (!response?.body) {
                    setFormattedBody('');
                    return;
                }

                const responseContentType = response.headers?.find(h =>
                    h.key.toLowerCase() === 'content-type'
                )?.value || '';

                if (responseContentType.includes('application/json')) {
                    setContentType('json');
                    try {
                        const parsed = JSON.parse(response.body);
                        setFormattedBody(JSON.stringify(parsed, null, 2));
                    } catch (e) {
                        setFormattedBody(response.body);
                    }
                } else if (responseContentType.includes('application/xml') || responseContentType.includes('text/xml')) {
                    setContentType('xml');
                    setFormattedBody(formatXML(response.body));
                } else {
                    setContentType('text');
                    setFormattedBody(response.body);
                }
            }, [response]);

            if (activeTab !== 'Body' || !response) return null;

            const getHighlightedContent = () => {
                if (contentType === 'json') {
                    return highlightJSON(formattedBody);
                } else if (contentType === 'xml') {
                    return highlightXML(formattedBody);
                }
                return formattedBody;
            };

            return (
                <div className="h-full bg-gray-900 border border-gray-600 rounded">
                    <div className="flex items-center justify-between px-3 py-2 bg-gray-800 border-b border-gray-600">
                        <div className="text-xs text-gray-300">
                            Response Body ({contentType.toUpperCase()})
                        </div>
                        <div className="text-xs text-gray-400">
                            {response.size} bytes
                        </div>
                    </div>

                    <div className="relative h-full overflow-auto">
                        <div className="absolute left-0 top-0 bottom-0 w-12 bg-gray-800 border-r border-gray-600 p-3 line-numbers text-right">
                            <pre className="whitespace-pre leading-6">{generateLineNumbers(formattedBody || '\n')}</pre>
                        </div>

                        <div className="ml-12 p-3">
                            <pre
                                className="whitespace-pre-wrap break-words leading-6 font-mono text-sm"
                                dangerouslySetInnerHTML={{ __html: getHighlightedContent() }}
                            />
                        </div>
                    </div>
                </div>
            );
        }

        function APITester() {
            // Initialize state from storage
            const [savedRequests, setSavedRequests] = useState(() => {
                return loadRequestsFromStorage();
            });

            const [settings, setSettings] = useState(() => {
                return loadSettingsFromStorage();
            });

            // State
            const [showSaveModal, setShowSaveModal] = useState(false);
            const [requestName, setRequestName] = useState('');
            const [activeRequestId, setActiveRequestId] = useState(null);

            // Request state
            const [method, setMethod] = useState('GET');
            const [url, setUrl] = useState('');
            const [activeRequestTab, setActiveRequestTab] = useState('Params');
            const [params, setParams] = useState([{ key: '', value: '', enabled: true }]);
            const [headers, setHeaders] = useState([{ key: '', value: '', enabled: true }]);
            const [bodyType, setBodyType] = useState('JSON');
            const [body, setBody] = useState('{\n  "key": "value"\n}');

            // Response state - now persisted until send is clicked
            const [loading, setLoading] = useState(false);
            const [response, setResponse] = useState(null);
            const [responseHeaders, setResponseHeaders] = useState([]);
            const [activeResponseTab, setActiveResponseTab] = useState('Body');
            const [error, setError] = useState('');

            // Save requests to storage whenever savedRequests changes
            useEffect(() => {
                saveRequestsToStorage(savedRequests);
            }, [savedRequests]);

            // Auto-save current request when body changes
            const handleAutoSave = (newBody) => {
                // Only auto-save if we have an active request
                if (activeRequestId) {
                    setSavedRequests(prev => prev.map(req =>
                        req.id === activeRequestId
                            ? { ...req, body: newBody, method, url, params: params.filter(p => p.key), headers: headers.filter(h => h.key), bodyType }
                            : req
                    ));
                }
            };

            const saveCurrentRequest = () => {
                if (!requestName.trim()) return;

                const newRequest = {
                    id: Date.now(),
                    name: requestName,
                    method,
                    url,
                    params: params.filter(p => p.key),
                    headers: headers.filter(h => h.key),
                    bodyType,
                    body,
                    response: response, // Save response with request
                    responseHeaders: responseHeaders,
                    createdAt: new Date().toISOString()
                };

                setSavedRequests(prev => [...prev, newRequest]);
                setShowSaveModal(false);
                setRequestName('');
                setActiveRequestId(newRequest.id);
            };

            const loadRequest = (request) => {
                setMethod(request.method);
                setUrl(request.url);
                setParams([...request.params, { key: '', value: '', enabled: true }]);
                setHeaders([...request.headers, { key: '', value: '', enabled: true }]);
                setBodyType(request.bodyType);
                setBody(request.body);
                setActiveRequestId(request.id);

                // Restore the saved response if it exists
                if (request.response) {
                    setResponse(request.response);
                    setResponseHeaders(request.responseHeaders || []);
                } else {
                    setResponse(null);
                    setResponseHeaders([]);
                }
                setError('');
            };

            const deleteRequest = (id, e) => {
                e.stopPropagation();
                if (confirm('Are you sure you want to delete this request?')) {
                    setSavedRequests(prev => prev.filter(req => req.id !== id));
                    if (activeRequestId === id) {
                        setActiveRequestId(null);
                    }
                }
            };

            const clearAllRequests = () => {
                if (confirm('Are you sure you want to delete all saved requests? This cannot be undone.')) {
                    setSavedRequests([]);
                    setActiveRequestId(null);
                }
            };

            const exportRequests = () => {
                const dataStr = JSON.stringify(savedRequests, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `api_requests_${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                URL.revokeObjectURL(url);
            };

            const importRequests = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedRequests = JSON.parse(e.target.result);
                        if (Array.isArray(importedRequests)) {
                            const processedRequests = importedRequests.map(req => ({
                                ...req,
                                id: Date.now() + Math.random(),
                                importedAt: new Date().toISOString()
                            }));
                            setSavedRequests(prev => [...prev, ...processedRequests]);
                            alert(`Successfully imported ${processedRequests.length} requests!`);
                        } else {
                            alert('Invalid file format: Expected an array of requests');
                        }
                    } catch (error) {
                        alert('Invalid JSON file format');
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            const newRequest = () => {
                setMethod('GET');
                setUrl('');
                setParams([{ key: '', value: '', enabled: true }]);
                setHeaders([{ key: '', value: '', enabled: true }]);
                setBody('{\n  "key": "value"\n}');
                setBodyType('JSON');
                setActiveRequestId(null);
                setResponse(null);
                setResponseHeaders([]);
                setError('');
            };

            const addParam = () => {
                setParams([...params, { key: '', value: '', enabled: true }]);
            };

            const updateParam = (index, field, value) => {
                const newParams = [...params];
                newParams[index][field] = value;
                setParams(newParams);
            };

            const addHeader = () => {
                setHeaders([...headers, { key: '', value: '', enabled: true }]);
            };

            const updateHeader = (index, field, value) => {
                const newHeaders = [...headers];
                newHeaders[index][field] = value;
                setHeaders(newHeaders);
            };

            const buildUrlWithParams = () => {
                if (!url) return '';

                const enabledParams = params.filter(p => p.enabled && p.key && p.value);
                if (enabledParams.length === 0) return url;

                const queryParams = enabledParams.map(param => {
                    const key = param.key.startsWith('$') ? param.key : encodeURIComponent(param.key);
                    const value = encodeURIComponent(param.value);
                    return `${key}=${value}`;
                }).join('&');

                const separator = url.includes('?') ? '&' : '?';
                return url + separator + queryParams;
            };

            const sendRequest = async () => {
                if (!url.trim()) {
                    setError('Please enter a valid URL');
                    return;
                }

                setLoading(true);
                setError('');
                // Clear previous response when sending new request
                setResponse(null);
                setResponseHeaders([]);

                try {
                    const finalUrl = buildUrlWithParams();
                    const startTime = Date.now();

                    const requestHeaders = {};
                    headers.filter(h => h.enabled && h.key).forEach(header => {
                        requestHeaders[header.key] = header.value;
                    });

                    let csrfToken = null;
                    try {
                        const csrfResponse = await fetch(finalUrl, {
                            method: 'HEAD',
                            headers: { 'X-CSRF-Token': 'Fetch' }
                        });
                        csrfToken = csrfResponse.headers.get('X-CSRF-Token');
                        if (csrfToken) {
                            requestHeaders['X-CSRF-Token'] = csrfToken;
                        }
                    } catch (e) {
                        // CSRF token fetch failed, continue without it
                    }

                    requestHeaders['Accept'] = 'application/json';

                    const requestOptions = {
                        method: method,
                        headers: requestHeaders,
                    };

                    if (method !== 'GET' && method !== 'HEAD') {
                        if (bodyType === 'JSON') {
                            try {
                                JSON.parse(body);
                                requestOptions.body = body;
                                requestOptions.headers['Content-Type'] = 'application/json';
                            } catch (e) {
                                setError('Invalid JSON in request body');
                                setLoading(false);
                                return;
                            }
                        } else {
                            requestOptions.body = body;
                        }
                    }

                    const response = await fetch(finalUrl, requestOptions);
                    const endTime = Date.now();
                    const responseTime = endTime - startTime;

                    const responseHeadersArray = [];
                    response.headers.forEach((value, key) => {
                        responseHeadersArray.push({ key, value });
                    });
                    setResponseHeaders(responseHeadersArray);

                    const contentType = response.headers.get('Content-Type') || '';
                    let responseBody;

                    if (contentType.includes('application/json')) {
                        try {
                            const jsonData = await response.json();
                            responseBody = JSON.stringify(jsonData, null, 2);
                        } catch (e) {
                            responseBody = await response.text();
                        }
                    } else {
                        responseBody = await response.text();
                    }

                    const newResponse = {
                        status: response.status,
                        statusText: response.statusText,
                        body: responseBody,
                        time: responseTime,
                        size: new Blob([responseBody]).size,
                        headers: responseHeadersArray
                    };

                    setResponse(newResponse);

                    // Auto-save the response with the current request if it's saved
                    if (activeRequestId) {
                        setSavedRequests(prev => prev.map(req =>
                            req.id === activeRequestId
                                ? { ...req, response: newResponse, responseHeaders: responseHeadersArray }
                                : req
                        ));
                    }

                } catch (error) {
                    setError(`Request failed: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const getStatusBadgeClass = (status) => {
                if (status >= 200 && status < 300) return 'px-2 py-1 text-xs font-medium rounded status-success';
                if (status >= 400 && status < 500) return 'px-2 py-1 text-xs font-medium rounded status-warning';
                return 'px-2 py-1 text-xs font-medium rounded status-error';
            };

            const formatDate = (dateString) => {
                return new Date(dateString).toLocaleDateString() + ' ' +
                    new Date(dateString).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            };

            return (
                <div className="flex h-screen bg-gray-800 text-gray-100">
                    {/* Sidebar */}
                    <div className="w-80 bg-gray-800 border-r border-gray-700 flex flex-col">
                        {/* Sidebar Header */}
                        <div className="bg-blue-600 text-white p-4 flex items-center justify-between">
                            <span className="font-semibold">API Tester</span>
                            <div className="flex space-x-2">
                                <button
                                    onClick={newRequest}
                                    className="p-1 hover:bg-blue-700 rounded"
                                    title="New Request"
                                >
                                    <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                        <path fillRule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clipRule="evenodd" />
                                    </svg>
                                </button>
                                <button
                                    onClick={exportRequests}
                                    className="p-1 hover:bg-blue-700 rounded"
                                    title="Export Requests"
                                >
                                    <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                        <path fillRule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clipRule="evenodd" />
                                    </svg>
                                </button>
                                <button
                                    onClick={clearAllRequests}
                                    className="p-1 hover:bg-blue-700 rounded"
                                    title="Clear All"
                                >
                                    <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                        <path fillRule="evenodd" d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z" clipRule="evenodd" />
                                        <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 012 0v6a1 1 0 11-2 0V7zm4 0a1 1 0 012 0v6a1 1 0 11-2 0V7z" clipRule="evenodd" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        {/* Storage Info */}
                        <div className="bg-blue-900 bg-opacity-50 border border-blue-700 p-3 m-3 rounded text-blue-200 text-xs">
                            💾 Auto-save enabled - Changes saved automatically
                        </div>

                        {/* Import Section */}
                        <div className="mx-3 mb-4 p-3 bg-gray-700 rounded">
                            <h4 className="text-sm font-medium mb-2 text-gray-300">Import Requests</h4>
                            <input
                                type="file"
                                accept=".json"
                                onChange={importRequests}
                                className="w-full text-xs bg-gray-600 border border-gray-500 rounded p-2 text-gray-200"
                            />
                        </div>

                        {/* Requests List */}
                        <div className="flex-1 overflow-y-auto p-3">
                            {savedRequests.length === 0 ? (
                                <div className="text-center text-gray-400 py-8">
                                    <svg className="w-12 h-12 mx-auto mb-3 text-gray-600" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z" />
                                        <path fillRule="evenodd" d="M4 5a2 2 0 012-2v1a1 1 0 001 1h6a1 1 0 001-1V3a2 2 0 012 2v6a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3z" clipRule="evenodd" />
                                    </svg>
                                    No saved requests yet.<br />
                                    <span className="text-sm">Save your first request!</span>
                                </div>
                            ) : (
                                <div className="space-y-2">
                                    {savedRequests.map(request => (
                                        <div
                                            key={request.id}
                                            className={`p-3 rounded cursor-pointer group flex items-center space-x-3 ${activeRequestId === request.id
                                                ? 'bg-blue-600 text-white'
                                                : 'bg-gray-700 hover:bg-gray-600 text-gray-200'
                                                }`}
                                            onClick={() => loadRequest(request)}
                                        >
                                            <span className={`px-2 py-1 text-xs font-bold rounded method-${request.method.toLowerCase()}`}>
                                                {request.method}
                                            </span>
                                            <div className="flex-1 min-w-0">
                                                <div className="font-medium text-sm truncate">{request.name}</div>
                                                <div className="text-xs opacity-75">
                                                    {formatDate(request.createdAt)}
                                                    {request.response && <span className="ml-2 text-green-400">📊</span>}
                                                </div>
                                            </div>
                                            <button
                                                className="opacity-0 group-hover:opacity-100 p-1 hover:bg-red-600 rounded"
                                                onClick={(e) => deleteRequest(request.id, e)}
                                                title="Delete request"
                                            >
                                                <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                                    <path fillRule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clipRule="evenodd" />
                                                </svg>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Main Area */}
                    <div className="flex-1 flex flex-col bg-gray-900">
                        {/* Header */}
                        <div className="bg-gray-800 border-b border-gray-700 p-4 flex items-center space-x-4">
                            <button
                                className="vscode-button px-3 py-2 rounded text-sm font-medium"
                                onClick={() => setShowSaveModal(true)}
                            >
                                Save Request
                            </button>
                        </div>

                        <div className="flex flex-1 overflow-hidden">
                            {/* Request Panel */}
                            <div className="flex-1 border-r border-gray-700 flex flex-col">
                                {/* URL Bar */}
                                <div className="p-4 border-b border-gray-700 bg-gray-800">
                                    <div className="flex space-x-3">
                                        <select
                                            className={`px-3 py-2 bg-gray-700 border border-gray-600 rounded text-sm font-semibold vscode-input method-${method.toLowerCase()}`}
                                            value={method}
                                            onChange={(e) => setMethod(e.target.value)}
                                        >
                                            <option value="GET">GET</option>
                                            <option value="POST">POST</option>
                                            <option value="PUT">PUT</option>
                                            <option value="PATCH">PATCH</option>
                                            <option value="DELETE">DELETE</option>
                                            <option value="HEAD">HEAD</option>
                                            <option value="OPTIONS">OPTIONS</option>
                                        </select>

                                        <input
                                            type="text"
                                            className="flex-1 px-3 py-2 vscode-input rounded text-sm"
                                            placeholder="https://api.example.com/endpoint"
                                            value={url}
                                            onChange={(e) => setUrl(e.target.value)}
                                        />

                                        <button
                                            className="vscode-button px-6 py-2 rounded text-sm font-medium"
                                            onClick={sendRequest}
                                            disabled={loading}
                                        >
                                            {loading ? 'Sending...' : 'Send'}
                                        </button>
                                    </div>
                                </div>

                                {/* Tabs */}
                                <div className="flex border-b border-gray-700 bg-gray-800">
                                    {['Params', 'Headers', 'Body'].map(tab => (
                                        <button
                                            key={tab}
                                            className={`px-6 py-3 text-sm font-medium ${activeRequestTab === tab ? 'tab-active' : 'tab-inactive'
                                                }`}
                                            onClick={() => setActiveRequestTab(tab)}
                                        >
                                            {tab}
                                        </button>
                                    ))}
                                </div>

                                {/* Tab Content */}
                                <div className="flex-1 overflow-auto bg-gray-900">
                                    {activeRequestTab === 'Params' && (
                                        <div className="p-4">
                                            <div className="grid grid-cols-3 gap-3 mb-3 text-sm font-semibold text-gray-400">
                                                <div>Key</div>
                                                <div>Value</div>
                                                <div className="w-6"></div>
                                            </div>
                                            {params.map((param, index) => (
                                                <div key={index} className="grid grid-cols-3 gap-3 mb-3">
                                                    <input
                                                        type="text"
                                                        className="vscode-input px-3 py-2 rounded text-sm"
                                                        placeholder="Key"
                                                        value={param.key}
                                                        onChange={(e) => updateParam(index, 'key', e.target.value)}
                                                    />
                                                    <input
                                                        type="text"
                                                        className="vscode-input px-3 py-2 rounded text-sm"
                                                        placeholder="Value"
                                                        value={param.value}
                                                        onChange={(e) => updateParam(index, 'value', e.target.value)}
                                                    />
                                                    <input
                                                        type="checkbox"
                                                        className="w-4 h-4"
                                                        checked={param.enabled}
                                                        onChange={(e) => updateParam(index, 'enabled', e.target.checked)}
                                                    />
                                                </div>
                                            ))}
                                            <button
                                                className="mt-3 px-4 py-2 border border-dashed border-gray-600 text-gray-400 hover:text-white hover:border-gray-500 rounded text-sm"
                                                onClick={addParam}
                                            >
                                                Add Parameter
                                            </button>
                                        </div>
                                    )}

                                    {activeRequestTab === 'Headers' && (
                                        <div className="p-4">
                                            <div className="grid grid-cols-3 gap-3 mb-3 text-sm font-semibold text-gray-400">
                                                <div>Key</div>
                                                <div>Value</div>
                                                <div className="w-6"></div>
                                            </div>
                                            {headers.map((header, index) => (
                                                <div key={index} className="grid grid-cols-3 gap-3 mb-3">
                                                    <input
                                                        type="text"
                                                        className="vscode-input px-3 py-2 rounded text-sm"
                                                        placeholder="Header name"
                                                        value={header.key}
                                                        onChange={(e) => updateHeader(index, 'key', e.target.value)}
                                                    />
                                                    <input
                                                        type="text"
                                                        className="vscode-input px-3 py-2 rounded text-sm"
                                                        placeholder="Header value"
                                                        value={header.value}
                                                        onChange={(e) => updateHeader(index, 'value', e.target.value)}
                                                    />
                                                    <input
                                                        type="checkbox"
                                                        className="w-4 h-4"
                                                        checked={header.enabled}
                                                        onChange={(e) => updateHeader(index, 'enabled', e.target.checked)}
                                                    />
                                                </div>
                                            ))}
                                            <button
                                                className="mt-3 px-4 py-2 border border-dashed border-gray-600 text-gray-400 hover:text-white hover:border-gray-500 rounded text-sm"
                                                onClick={addHeader}
                                            >
                                                Add Header
                                            </button>
                                        </div>
                                    )}

                                    {activeRequestTab === 'Body' && (
                                        <div className="p-4 h-full flex flex-col">
                                            <div className="flex space-x-2 mb-4">
                                                {['JSON', 'Text', 'XML'].map(type => (
                                                    <button
                                                        key={type}
                                                        className={`px-3 py-1 text-sm rounded ${bodyType === type
                                                            ? 'bg-blue-600 text-white'
                                                            : 'bg-gray-700 text-gray-300 hover:bg-gray-600'
                                                            }`}
                                                        onClick={() => setBodyType(type)}
                                                    >
                                                        {type}
                                                    </button>
                                                ))}
                                            </div>
                                            <div className="flex-1">
                                                <VSCodeEditor
                                                    value={body}
                                                    onChange={setBody}
                                                    language={bodyType.toLowerCase()}
                                                    onAutoSave={handleAutoSave}
                                                />
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Response Panel */}
                            <div className="flex-1 flex flex-col">
                                {error && (
                                    <div className="bg-red-900 border border-red-700 text-red-200 p-3 m-4 rounded">
                                        {error}
                                    </div>
                                )}

                                {response && (
                                    <div className="bg-gray-800 border-b border-gray-700 p-4 flex items-center space-x-4">
                                        <span className={getStatusBadgeClass(response.status)}>
                                            {response.status} {response.statusText}
                                        </span>
                                        <span className="text-sm text-gray-400">
                                            Time: {response.time}ms
                                        </span>
                                        <span className="text-sm text-gray-400">
                                            Size: {response.size} bytes
                                        </span>
                                    </div>
                                )}

                                <div className="flex border-b border-gray-700 bg-gray-800">
                                    {['Body', 'Headers'].map(tab => (
                                        <button
                                            key={tab}
                                            className={`px-6 py-3 text-sm font-medium ${activeResponseTab === tab ? 'tab-active' : 'tab-inactive'
                                                }`}
                                            onClick={() => setActiveResponseTab(tab)}
                                        >
                                            {tab}
                                            {tab === 'Headers' && responseHeaders.length > 0 &&
                                                ` (${responseHeaders.length})`
                                            }
                                        </button>
                                    ))}
                                </div>

                                <div className="flex-1 overflow-auto">
                                    {loading && (
                                        <div className="flex items-center justify-center h-full text-blue-400">
                                            <div className="flex items-center space-x-2">
                                                <svg className="animate-spin w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                                    <path d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H8a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H12a1 1 0 110-2h4a1 1 0 011 1v4a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" />
                                                </svg>
                                                <span>Sending request...</span>
                                            </div>
                                        </div>
                                    )}

                                    {!loading && !response && !error && (
                                        <div className="flex items-center justify-center h-full text-gray-500">
                                            <div className="text-center">
                                                <svg className="w-16 h-16 mx-auto mb-4 text-gray-600" fill="currentColor" viewBox="0 0 20 20">
                                                    <path fillRule="evenodd" d="M3 5a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2h-2.22l.123.489.804.804A1 1 0 0113 18H7a1 1 0 01-.707-1.707l.804-.804L7.22 15H5a2 2 0 01-2-2V5zm5.771 7H5V5h10v7H8.771z" clipRule="evenodd" />
                                                </svg>
                                                <p>Send a request to see the response</p>
                                            </div>
                                        </div>
                                    )}

                                    {activeResponseTab === 'Body' && (
                                        <div className="h-full">
                                            <VSCodeResponseViewer
                                                response={response}
                                                activeTab={activeResponseTab}
                                            />
                                        </div>
                                    )}

                                    {response && activeResponseTab === 'Headers' && (
                                        <div className="p-4 font-mono text-sm">
                                            {responseHeaders.map((header, index) => (
                                                <div key={index} className="flex py-1 border-b border-gray-800 last:border-b-0">
                                                    <div className="w-48 text-gray-400 font-semibold">{header.key}:</div>
                                                    <div className="text-gray-200">{header.value}</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Save Request Modal */}
                    {showSaveModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-gray-800 border border-gray-600 rounded-lg p-6 w-96">
                                <h3 className="text-lg font-semibold mb-4 text-white">Save Request</h3>
                                <input
                                    type="text"
                                    placeholder="Enter request name"
                                    value={requestName}
                                    onChange={(e) => setRequestName(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && saveCurrentRequest()}
                                    className="w-full vscode-input px-3 py-2 rounded mb-4"
                                />
                                <div className="flex justify-end space-x-3">
                                    <button
                                        onClick={() => setShowSaveModal(false)}
                                        className="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={saveCurrentRequest}
                                        className="vscode-button px-4 py-2 rounded"
                                    >
                                        Save
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<APITester />, document.getElementById('root'));
    </script>
</body>

</html>
