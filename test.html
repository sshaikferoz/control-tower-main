        /* =======================
           XML → TREE LOGIC
           ======================= */
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "application/xml");

        function createNode(element) {
            const li = document.createElement("li");

            const nodeDiv = document.createElement("div");
            nodeDiv.className = "node";

            const toggle = document.createElement("span");
            toggle.className = "toggle";
            toggle.textContent = element.children.length ? "▶" : "";

            const label = document.createElement("span");
            label.textContent = element.tagName;

            nodeDiv.appendChild(toggle);
            nodeDiv.appendChild(label);

            // Attributes
            if (element.attributes.length > 0) {
                const attrSpan = document.createElement("span");
                attrSpan.className = "attr";
                const attrs = [];
                for (let attr of element.attributes) {
                    attrs.push(`${attr.name}="${attr.value}"`);
                }
                attrSpan.textContent = `(${attrs.join(", ")})`;
                nodeDiv.appendChild(attrSpan);
            }

            nodeDiv.onclick = (e) => {
                e.stopPropagation();

                document.querySelectorAll(".selected")
                    .forEach(n => n.classList.remove("selected"));

                nodeDiv.classList.add("selected");

                if (element.children.length) {
                    li.classList.toggle("expanded");
                    toggle.textContent = li.classList.contains("expanded") ? "▼" : "▶";
                }
            };

            li.appendChild(nodeDiv);

            if (element.children.length) {
                const ul = document.createElement("ul");
                ul.className = "children";

                Array.from(element.children).forEach(child => {
                    ul.appendChild(createNode(child));
                });

                li.appendChild(ul);
            }

            return li;
        }

        /* =======================
           RENDER TREE
           ======================= */
        const rootUl = document.createElement("ul");
        rootUl.appendChild(createNode(xmlDoc.documentElement));
        document.getElementById("tree").appendChild(rootUl);

        /* =======================
           TREE TABLE (BASED ON CHILDREN)
           ======================= */
        const treeTable = document.getElementById("tree-table");

        if (treeTable) {
            const thead = document.createElement("thead");
            const headerRow = document.createElement("tr");
            ["Name", "Attributes", "Value"].forEach(text => {
                const th = document.createElement("th");
                th.textContent = text;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            treeTable.appendChild(thead);

            const tbody = document.createElement("tbody");
            treeTable.appendChild(tbody);

            function addRow(element, level) {
                const tr = document.createElement("tr");
                tr.dataset.level = String(level);
                tr.dataset.hasChildren = element.children.length ? "true" : "false";
                tr.dataset.expanded = "false";

                const nameTd = document.createElement("td");
                nameTd.style.paddingLeft = `${level * 16}px`;

                const toggle = document.createElement("span");
                toggle.className = "toggle";
                toggle.textContent = element.children.length ? "▶" : "";

                const label = document.createElement("span");
                label.textContent = element.tagName;

                nameTd.appendChild(toggle);
                nameTd.appendChild(label);

                const attrsTd = document.createElement("td");
                if (element.attributes.length > 0) {
                    const attrs = [];
                    for (let attr of element.attributes) {
                        attrs.push(`${attr.name}="${attr.value}"`);
                    }
                    attrsTd.textContent = attrs.join(", ");
                } else {
                    attrsTd.textContent = "";
                }

                const valueTd = document.createElement("td");
                // Only show text content if it is a leaf (no element children)
                if (!element.children.length) {
                    const text = element.textContent.trim();
                    valueTd.textContent = text;
                } else {
                    valueTd.textContent = "";
                }

                tr.appendChild(nameTd);
                tr.appendChild(attrsTd);
                tr.appendChild(valueTd);

                tbody.appendChild(tr);

                Array.from(element.children).forEach(child => {
                    addRow(child, level + 1);
                });
            }

            // Build rows in pre-order
            addRow(xmlDoc.documentElement, 0);

            // Initially show only root row(s)
            Array.from(tbody.rows).forEach(row => {
                const level = Number(row.dataset.level || "0");
                if (level > 0) {
                    row.style.display = "none";
                }
            });

            // Toggle expand / collapse based on children logic
            treeTable.addEventListener("click", (event) => {
                const target = event.target;
                if (!(target instanceof HTMLElement)) return;

                const toggle = target.closest(".toggle");
                if (!toggle) return;

                const tr = toggle.closest("tr");
                if (!tr) return;

                const level = Number(tr.dataset.level || "0");
                const hasChildren = tr.dataset.hasChildren === "true";
                if (!hasChildren) return;

                const isExpanded = tr.dataset.expanded === "true";
                tr.dataset.expanded = isExpanded ? "false" : "true";
                toggle.textContent = isExpanded ? "▶" : "▼";

                const rows = Array.from(tbody.rows);
                const startIndex = rows.indexOf(tr);

                if (startIndex === -1) return;

                if (!isExpanded) {
                    // Expanding: show only direct children; deeper levels
                    // stay hidden until their own parents are expanded.
                    for (let i = startIndex + 1; i < rows.length; i++) {
                        const row = rows[i];
                        const rowLevel = Number(row.dataset.level || "0");
                        if (rowLevel <= level) break;
                        if (rowLevel === level + 1) {
                            row.style.display = "";
                        }
                    }
                } else {
                    // Collapsing: hide all descendants and reset their toggles/expanded state.
                    for (let i = startIndex + 1; i < rows.length; i++) {
                        const row = rows[i];
                        const rowLevel = Number(row.dataset.level || "0");
                        if (rowLevel <= level) break;
                        row.style.display = "none";
                        row.dataset.expanded = "false";

                        const rowToggle = row.querySelector(".toggle");
                        if (rowToggle instanceof HTMLElement) {
                            rowToggle.textContent = row.dataset.hasChildren === "true" ? "▶" : "";
                        }
                    }
                }
            });
        }
